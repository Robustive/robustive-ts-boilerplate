name: "inspector"
services:
  postgres:
    image: "postgres:16.4-alpine"
    environment:
      POSTGRES_PASSWORD: P@ssw0rd
    ports:
      - "5432:5432"
    volumes:
      - ./containers/postgres/scripts:/docker-entrypoint-initdb.d
      - ./containers/postgres/ddl:/sqls
      - ./containers/postgres/.data:/var/lib/postgresql/data
